<article id="content">
<p>这是一篇用于走查的示例正文。它由服务端直出，静态 HTML 里就能读到完整内容，
所以形态判断应为静态页，而不是 CSR 空壳。判断依据是内容区的可见文本量，
不是整页长度：导航、页脚和推荐位会把整页撑大。</p>
<p>走查时先认形态，再判三态，再跑客户端矩阵。单发请求只能说明这一发怎么样，
要判断是否概率门，必须固定客户端栈多跑几次，报翻转率与内容区间。</p>
<p>完整率的分母是可访问成功的样本，与可访问性成功率不同。把这两个指标合成
一个“成功率”，得到的数字无法指导下一次行动。</p>
</article>
