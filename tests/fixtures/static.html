静态直出的页面形如本文：服务端把正文写进 HTML，客户端拿到就能抽。
判断一份响应是不是静态页，要看内容区的可见文本量，而不是整页长度。
导航、页脚、推荐位和登录引导都会把整页长度撑大，但内容区仍然可以是空的。
因此阈值必须绑在路由与内容选择器上，并用真实浏览器基线校准。
